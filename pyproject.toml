[project]
name = "castle-combat"
version = "0.9.0"
description = "Multiplayer action/strategy game"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Karl Bartel", email = "karl42@gmail.com" }]
# pygame-ce is the maintained pygame fork and is API-compatible (it still
# provides the `pygame` module). Unlike pygame, it ships wheels for current
# Python versions, so no source build is needed.
#
# The lower bounds are support floors, not known breakage: the test suite passes
# on all of them, and the API the game uses (surfarray, SCALED, reactor) has been
# stable for far longer. They exist so a bug report names a combination that was
# actually tried. numpy in particular needs no `>=2` bound -- the fixes in
# 90d0e50 and 65600a1 work under both major versions.
dependencies = ["pygame-ce>=2.2", "numpy>=1.26", "twisted>=22.10"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/karlb/castle-combat"
Issues = "https://github.com/karlb/castle-combat/issues"

[project.scripts]
castle-combat = "castle_combat.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castle_combat"]

[tool.ruff.lint]
# pyflakes plus the pycodestyle rules that catch real problems rather than
# layout, which `ruff format` handles. Selected explicitly rather than left to
# ruff's default, because that default changes between ruff releases: 0.16
# dropped E711/E712/E713 from it and added a dozen other groups. Pinning the
# set keeps an upgrade from silently changing what counts as a warning.
select = ["E4", "E7", "E9", "F"]
# The four *player modules define their networked subclasses below the
# implementation class they wrap, and sound.py imports config at the bottom to
# break an import cycle. Neither is accidental.
ignore = ["E402"]
